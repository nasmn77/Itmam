name: اقتراح كلمة أو عبارة · Word or phrase suggestion
description: كلمة ناقصة، أو اقتراح خاطئ، أو عبارة شائعة، أو خطأ إملائي شائع · A missing word, a wrong suggestion, a common phrase or a common misspelling
labels: [dictionary]
body:
  - type: dropdown
    id: kind
    attributes:
      label: نوع الاقتراح · Kind
      options:
        - كلمة ناقصة لا يقترحها إتمام · A missing word
        - اقتراح خاطئ أو غير لائق · A wrong or inappropriate suggestion
        - عبارة متلازمة شائعة · A common phrase
        - خطأ إملائي شائع وتصحيحه · A common misspelling and its fix
    validations:
      required: true
  - type: textarea
    id: words
    attributes:
      label: الكلمات · The words
      description: |
        كلمة أو عبارة في كل سطر. للخطأ الشائع: الخطأ = الصواب، مثل «لاكن = لكن».
        One per line. For a misspelling: wrong = right, such as «لاكن = لكن».
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: ملاحظة (اختياري) · Note (optional)
      description: أين تُستعمل، أو ماذا كتبت فظهر الاقتراح الخاطئ · Where it is used, or what you typed when the wrong suggestion appeared.

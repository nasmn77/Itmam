name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Itmam.CI.slnf

      - name: Build
        run: dotnet build Itmam.CI.slnf -c Release --no-restore

      - name: Test
        run: dotnet test --solution Itmam.CI.slnf -c Release --no-build
